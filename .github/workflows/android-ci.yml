name: Android CI
on:
  push:
    branches: [main, release-hardening-2026]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile debug and run unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
